<style>
:root {

.payments-summary div { padding: 18px; border-right: 1px solid var(--line); }
.payments-summary div:last-child { border: 0; }
.payments-summary span { display: block; color: var(--ink-soft); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.payments-summary strong { display: block; margin-top: 4px; font-family: "Newsreader", serif; font-size: 27px; }
.payment-row { grid-template-columns: 44px minmax(150px, 1.5fr) minmax(145px, 1fr) 80px auto; }
.amount { font-family: "Newsreader", serif; font-size: 19px; font-weight: 600; }
.credit-panel { max-width: 940px; margin-top: 24px; }

.modal { width: min(650px, calc(100vw - 28px)); padding: 0; border: 0; border-radius: 14px; color: var(--ink); background: var(--white); box-shadow: var(--shadow); }

.form-grid .check-row input { width: 16px; min-height: 16px; accent-color: var(--accent); }

.action-spacer { flex: 1; }
.toast { position: fixed; z-index: 100; right: 24px; bottom: 24px; visibility: hidden; padding: 12px 16px; border-radius: 8px; color: white; background: var(--ink); box-shadow: var(--shadow); font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: .2s ease; }
.toast.show { visibility: visible; opacity: 1; transform: translateY(0); }

@media (max-width: 1050px) {

}
